// 生成個案爭取表格
function generateCaseTable(noteId) {
    const note = notes.find(n => n.id === noteId);
    if (!note || note.type !== 'case') {
        showNotification('找不到個案資料', 'error');
        return;
    }    // 創建表格數據
    const tableData = {
        headers: ['序號', '客戶', '爭取項目', '爭取原因', '客戶資訊', '客服', '核示結果'],
        rows: [{
            序號: '1',
            客戶: note.caseSys || '',
            爭取項目: note.caseProject || '',
            爭取原因: note.caseReason || '',
            客戶資訊: `貢獻度:${note.caseContribution || ''}\nP&L:${note.casePL || ''}\n${note.caseCardTime || ''}`,
            客服: '',
            核示結果: ''
        }]
    };
    
    showTableModal(tableData);
}

// 顯示表格彈出視窗
function showTableModal(tableData) {
    // 創建彈出視窗HTML
    const modalHTML = `
        <div class="table-modal" id="tableModal">
            <div class="table-modal-content">
                <div class="table-modal-header">
                    <h3><i class="fas fa-table"></i> 個案爭取表格</h3>
                    <div class="table-modal-actions">
                        <button class="table-action-btn btn-copy" onclick="copyTableToClipboard()">
                            <i class="fas fa-copy"></i> 複製表格
                        </button>
                        <button class="table-action-btn btn-close" onclick="closeTableModal()">
                            <i class="fas fa-times"></i> 關閉
                        </button>
                    </div>
                </div>
                <div class="table-container">
                    ${generateEditableTable(tableData)}
                </div>
            </div>
        </div>
        <div class="table-copy-notification" id="copyNotification">
            <i class="fas fa-check"></i> 表格已複製到剪貼板
        </div>
    `;
    
    // 添加到頁面
    document.body.insertAdjacentHTML('beforeend', modalHTML);
    
    // 設置表格編輯功能
    setupTableEditing();
}

// 生成可編輯表格HTML
function generateEditableTable(tableData) {
    let tableHTML = '<table class="editable-table" id="editableTable">';
    
    // 表頭
    tableHTML += '<thead><tr>';
    tableData.headers.forEach((header, index) => {
        tableHTML += `<th data-col="${index}" onclick="editHeader(${index})">${header}</th>`;
    });
    tableHTML += '</tr></thead>';
      // 表格內容
    tableHTML += '<tbody>';
    tableData.rows.forEach((row, rowIndex) => {
        tableHTML += '<tr>';
        tableData.headers.forEach((header, colIndex) => {
            const cellValue = row[header] || '';
            // 處理多行內容，將換行符轉換為 <br> 標籤
            const formattedValue = cellValue.replace(/\n/g, '<br>');
            tableHTML += `<td data-row="${rowIndex}" data-col="${colIndex}" onclick="editCell(${rowIndex}, ${colIndex})">${formattedValue}</td>`;
        });
        tableHTML += '</tr>';
    });
    tableHTML += '</tbody>';
    
    tableHTML += '</table>';
    return tableHTML;
}

// 設置表格編輯功能
function setupTableEditing() {
    // ESC 鍵關閉編輯
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const editingCells = document.querySelectorAll('.editable-table .editing');
            editingCells.forEach(cell => {
                finishCellEdit(cell);
            });
        }
    });
}

// 編輯表頭
function editHeader(colIndex) {
    const th = document.querySelector(`th[data-col="${colIndex}"]`);
    if (th.classList.contains('editing')) return;
    
    const originalText = th.textContent;
    th.classList.add('editing');
    
    const input = document.createElement('input');
    input.type = 'text';
    input.value = originalText;
    input.className = 'cell-input';
    input.style.color = 'white';
    
    th.innerHTML = '';
    th.appendChild(input);
    input.focus();
    input.select();
    
    function finishEdit() {
        const newValue = input.value.trim() || originalText;
        th.textContent = newValue;
        th.classList.remove('editing');
    }
    
    input.addEventListener('blur', finishEdit);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            finishEdit();
        }
    });
}

// 編輯表格單元格
function editCell(rowIndex, colIndex) {
    const td = document.querySelector(`td[data-row="${rowIndex}"][data-col="${colIndex}"]`);
    if (td.classList.contains('editing')) return;
    
    // 從 innerHTML 中提取原始文字，將 <br> 轉換為換行符
    const originalHTML = td.innerHTML;
    const originalText = originalHTML.replace(/<br\s*\/?>/gi, '\n');
    // 移除其他HTML標籤
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = originalText;
    const cleanText = tempDiv.textContent;
    
    td.classList.add('editing');
    
    const textarea = document.createElement('textarea');
    textarea.value = cleanText;
    textarea.className = 'cell-input';
    textarea.style.height = 'auto';
    
    td.innerHTML = '';
    td.appendChild(textarea);
    textarea.focus();
    textarea.select();
    
    // 自動調整高度
    function autoResize() {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }
    
    textarea.addEventListener('input', autoResize);
    autoResize();
      function finishEdit() {
        const newValue = textarea.value;
        // 將換行符轉換為 <br> 標籤顯示
        const displayValue = newValue.replace(/\n/g, '<br>');
        td.innerHTML = displayValue;
        td.classList.remove('editing');
    }
    
    textarea.addEventListener('blur', finishEdit);
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            finishEdit();
        }
    });
}

// 完成單元格編輯
function finishCellEdit(cell) {
    if (cell.querySelector('.cell-input')) {
        const input = cell.querySelector('.cell-input');
        const newValue = input.value;
        cell.textContent = newValue;
        cell.classList.remove('editing');
    }
}

// 複製表格到剪貼板
async function copyTableToClipboard() {
    const table = document.getElementById('editableTable');
    if (!table) return;
    
    try {
        // 創建一個包含完整樣式的表格副本
        const tableClone = table.cloneNode(true);
          // 添加內聯樣式確保格式正確
        const styledTableHTML = `
            <table style="border-collapse: collapse; width: 100%; font-family: Arial, sans-serif; border: 2px solid #333;">
                ${Array.from(tableClone.querySelectorAll('thead tr')).map(row => 
                    `<tr>${Array.from(row.querySelectorAll('th')).map(cell => 
                        `<th style="border: 1px solid #333; padding: 12px 8px; background: #f8f9fa; font-weight: 600; text-align: left;">${cell.textContent}</th>`
                    ).join('')}</tr>`
                ).join('')}
                ${Array.from(tableClone.querySelectorAll('tbody tr')).map(row => 
                    `<tr>${Array.from(row.querySelectorAll('td')).map(cell => 
                        `<td style="border: 1px solid #333; padding: 12px 8px; background: white; text-align: left; white-space: pre-line;">${cell.innerHTML}</td>`
                    ).join('')}</tr>`
                ).join('')}
            </table>
        `;
          // 創建純文字格式的表格
        const rows = Array.from(table.querySelectorAll('tr'));
        const textTable = rows.map(row => {
            const cells = Array.from(row.querySelectorAll('th, td'));
            return cells.map(cell => {
                // 處理多行內容，將 <br> 轉換為換行符
                const text = cell.innerHTML.replace(/<br\s*\/?>/gi, '\n');
                // 移除其他HTML標籤
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = text;
                return tempDiv.textContent.trim();
            }).join('\t');
        }).join('\n');
        
        // 嘗試同時複製HTML和純文字格式
        if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([
                new ClipboardItem({
                    'text/html': new Blob([styledTableHTML], { type: 'text/html' }),
                    'text/plain': new Blob([textTable], { type: 'text/plain' })
                })
            ]);
        } else {
            // 降級方案：只複製純文字
            await navigator.clipboard.writeText(textTable);
        }
        
        showCopyNotification();
    } catch (error) {
        console.error('複製失敗:', error);
        // 手動選擇文字的降級方案
        selectTableText(table);
        showNotification('請手動複製選中的表格', 'warning');
    }
}

// 手動選擇表格文字
function selectTableText(table) {
    if (window.getSelection && document.createRange) {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(table);
        selection.removeAllRanges();
        selection.addRange(range);
    }
}

// 顯示複製成功通知
function showCopyNotification() {
    const notification = document.getElementById('copyNotification');
    notification.classList.add('show');
    
    setTimeout(() => {
        notification.classList.remove('show');
    }, 2000);
}

// 關閉表格彈出視窗
function closeTableModal() {
    const modal = document.getElementById('tableModal');
    const notification = document.getElementById('copyNotification');
    
    if (modal) {
        modal.style.opacity = '0';
        setTimeout(() => {
            modal.remove();
            if (notification) notification.remove();
        }, 300);
    }
}

// 點擊外部關閉彈出視窗
document.addEventListener('click', function(e) {
    const modal = document.getElementById('tableModal');
    if (modal && e.target === modal) {
        closeTableModal();
    }
});

// 新增：全域函數暴露（確保功能可用）

// ========== 篩選功能 ==========

let currentFilter = 'all'; // 記錄當前篩選狀態

// 按類型篩選便利貼
function filterNotesByType(filterType) {
    currentFilter = filterType;
    
    // 更新統計卡片的視覺狀態
    document.querySelectorAll('.stat-card').forEach(card => {
        card.classList.remove('active');
    });
    
    // 根據篩選類型顯示對應的統計卡片為啟用狀態
    const filterMap = {
        'today': 0,
        'all': 1,
        'todo': 2,
        'callback': 3,
        'case': 4
    };
    
    const activeIndex = filterMap[filterType];
    if (activeIndex !== undefined) {
        const cards = document.querySelectorAll('.stat-card');
        if (cards[activeIndex]) {
            cards[activeIndex].classList.add('active');
        }
    }
    
    // 重新渲染便利貼
    renderFilteredNotes();
    
    // 顯示篩選狀態提示
    const filterNames = {
        'today': '今日便利貼',
        'all': '所有便利貼',
        'todo': '待辦事項',
        'callback': '回電提醒',
        'case': '個案爭取'
    };
    
    showNotification(`篩選顯示：${filterNames[filterType]}`, 'info');
}

// 渲染篩選後的便利貼
function renderFilteredNotes() {
    let filteredNotes = notes;
    
    switch (currentFilter) {
        case 'today':
            const today = new Date().toDateString();
            filteredNotes = notes.filter(note => 
                new Date(note.createdAt).toDateString() === today
            );
            break;
        case 'todo':
            filteredNotes = notes.filter(note => note.type === 'todo');
            break;
        case 'callback':
            filteredNotes = notes.filter(note => note.type === 'callback');
            break;
        case 'case':
            filteredNotes = notes.filter(note => note.type === 'case');
            break;
        case 'all':
        default:
            filteredNotes = notes;
            break;
    }
    
    const container = document.getElementById('notesContainer');
    
    if (filteredNotes.length === 0) {
        const filterNames = {
            'today': '今日便利貼',
            'all': '便利貼',
            'todo': '待辦事項',
            'callback': '回電提醒',
            'case': '個案爭取'
        };
        
        container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #7f8c8d;">
                <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px;"></i>
                <h3>沒有找到${filterNames[currentFilter]}</h3>
                <p>
                    ${currentFilter === 'all' ? '點擊上方的「新增便利貼」按鈕開始使用' : 
                      `目前沒有${filterNames[currentFilter]}，`}
                    <button onclick="filterNotesByType('all')" style="background: none; border: none; color: #3498db; text-decoration: underline; cursor: pointer;">
                        顯示所有便利貼
                    </button>
                </p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = filteredNotes.map(note => {
        // 生成智能提示HTML
        let hintsHtml = '';
        if (smartHintsEnabled && note.hints && note.hints.length > 0) {
            hintsHtml = '<div class="smart-hints">';
            note.hints.forEach(hint => {
                hintsHtml += `<span class="hint-item ${hint.type}">${hint.text}</span>`;
            });
            hintsHtml += '</div>';
        }
        
        // 添加完成狀態的視覺效果
        let completedClass = '';
        if ((note.type === 'todo' && note.todoCompleted) ||
            (note.type === 'callback' && note.callbackCompleted) ||
            (note.type === 'case' && note.caseCompleted)) {
            completedClass = 'completed';
        }
        
        return `
        <div class="note ${note.color} ${completedClass}" id="note-${note.id}">
            <div class="note-header">
                <textarea 
                    class="note-title" 
                    placeholder="標題..."
                    oninput="updateNoteContent('${note.id}', 'title', this.value)"
                >${note.title || ''}</textarea>                <div class="note-actions">
                    <div class="dropdown">
                        <button class="note-btn" onclick="toggleColorPicker('${note.id}')">
                            <i class="fas fa-palette"></i>
                        </button>
                        <div class="color-picker" id="color-${note.id}" style="display: none;">
                            <div class="color-option" onclick="changeNoteColor('${note.id}', 'yellow')" style="background: #ffeaa7;">
                                <span class="color-label">📝 一般</span>
                            </div>
                            <div class="color-option" onclick="changeNoteColor('${note.id}', 'pink')" style="background: #fd79a8;">
                                <span class="color-label">✅ 待辦</span>
                            </div>
                            <div class="color-option" onclick="changeNoteColor('${note.id}', 'orange')" style="background: #fdcb6e;">
                                <span class="color-label">📞 回電</span>
                            </div>
                            <div class="color-option" onclick="changeNoteColor('${note.id}', 'purple')" style="background: #a29bfe;">
                                <span class="color-label">💼 個案爭取</span>
                            </div>
                        </div>
                    </div>
                    <button class="note-btn" onclick="deleteNote('${note.id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
              <textarea 
                class="note-content" 
                placeholder="在這裡輸入內容..."
                oninput="updateNoteContent('${note.id}', 'content', this.value)"
            >${note.content || ''}</textarea>
            
            ${generateSpecialFields(note)}
            
            ${hintsHtml}
            
            <div class="note-footer">
                <span>${formatDate(note.createdAt)}</span>
                ${completedClass ? '<span class="completed-badge"><i class="fas fa-check-circle"></i> 已完成</span>' : ''}
            </div>
        </div>        `;
    }).join('');    // 為每個便利貼設置編輯事件監聽器
    setTimeout(() => {
        filteredNotes.forEach(note => {
            setupNoteEventListeners(note.id);
        });
    }, 50);
}


</script>
